<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine Running</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: #ffffff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
      }

      #game-container {
        margin-bottom: 20px;
      }

      .controls {
        max-width: 800px;
        width: 100%;
      }

      .controls h2 {
        font-size: 18px;
        margin-bottom: 10px;
        color: #aaaaaa;
      }

      .controls table {
        width: 100%;
        border-collapse: collapse;
      }

      .controls td {
        padding: 8px 12px;
        border-bottom: 1px solid #333;
      }

      .controls td:first-child {
        font-weight: bold;
        width: 150px;
        color: #ffdd57;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div class="controls">
      <h2>How to Play</h2>
      <table>
        <tr>
          <td>Space</td>
          <td>Jump</td>
        </tr>
        <tr>
          <td>Enter</td>
          <td>Throw Chainsaw</td>
        </tr>
      </table>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
